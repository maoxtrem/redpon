server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portainer.redpon.com;

    # Certificado compartido que cubre redpon.com y portainer.redpon.com.
    ssl_certificate /etc/letsencrypt/live/redpon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redpon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        set $portainer_upstream http://portainer:9000;
        proxy_pass $portainer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
