server {
    listen 80;
    listen [::]:80;
    server_name redpon.com;

    # Let's Encrypt necesita esta ruta HTTP para emitir y renovar el certificado.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://redpon.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name portainer.redpon.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://portainer.redpon.com$request_uri;
    }
}
