events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/redpon/http.conf;

    include /etc/nginx/redpon/portainer.conf;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name redpon.com;

        ssl_certificate /etc/letsencrypt/live/redpon.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/redpon.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            set $app_upstream http://redpon:3000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
