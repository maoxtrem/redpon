events {}

http {
    # Resuelve el servicio bajo demanda. Si `app` está detenido, Nginx
    # continúa levantado y responderá 502 hasta que vuelva a estar disponible.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # HTTP: solo redirige a HTTPS.
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS: termina TLS y reenvía la solicitud al servicio interno.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name example.com www.example.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
