services:
  proxy:
    image: nginx:alpine
    container_name: basic-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app:/app:ro
    expose:
      - "3000"
    command: ["node", "server.js"]
    restart: unless-stopped
