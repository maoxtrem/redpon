services:
  proxy:
    image: nginx:alpine
    container_name: basic-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/redpon:ro
      - ./certs:/etc/letsencrypt:ro
      - ./certs/www:/var/www/certbot:ro
    command:
      - /bin/sh
      - -ec
      - |
        if [ -s /etc/letsencrypt/live/redpon.com/fullchain.pem ] && [ -s /etc/letsencrypt/live/redpon.com/privkey.pem ]; then
          cp /etc/nginx/redpon/nginx.conf /etc/nginx/nginx.conf
        else
          cp /etc/nginx/redpon/bootstrap.conf /etc/nginx/nginx.conf
        fi
        exec nginx -g 'daemon off;'
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certs/www:/var/www/certbot

  redpon:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/redpon:/app:ro
    expose:
      - "3000"
    command: ["node", "server.js"]
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    command: ["--http-enabled"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: redpon
      MYSQL_USER: redpon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mercure:
    image: dunglas/mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:?Configura MERCURE_PUBLISHER_JWT_KEY en .env}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:?Configura MERCURE_SUBSCRIBER_JWT_KEY en .env}
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configura REDIS_PASSWORD en .env}
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  portainer_data:
    external: true
    name: portainer_data
  mercure_data:
  mercure_config:
  redis_data:
